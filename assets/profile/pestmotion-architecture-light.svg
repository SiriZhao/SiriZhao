<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">PestMotion motion-intelligence architecture</title>
  <desc id="desc">Vision input flows through detection, multi-object tracking, motion estimation, adaptive prediction and advisory visualization.</desc>
  <rect width="1200" height="360" rx="18" fill="#f7fafc" stroke="#d9e5ee"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="44" y="48" font-size="14" font-weight="700" letter-spacing="2.5" fill="#2563a6">PESTMOTION / MOTION INTELLIGENCE</text>
    <text x="44" y="76" font-size="16" fill="#587086">Research pipeline for agricultural-robotics vision inputs · advisory output</text>
  </g>
  <g fill="none" stroke="#8eb3d2" stroke-width="3" stroke-linecap="round">
    <path d="M188 176H223M368 176H403M548 176H583M728 176H763M908 176H943"/>
    <path d="M213 167l12 9-12 9M393 167l12 9-12 9M573 167l12 9-12 9M753 167l12 9-12 9M933 167l12 9-12 9"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g><rect x="42" y="128" width="146" height="96" rx="12" fill="#e6f2fb" stroke="#4c8abe" stroke-width="2"/><text x="115" y="166" font-size="15" font-weight="700" fill="#1e527f">Vision input</text><text x="115" y="190" font-size="12" fill="#557086">local · USB · LAN</text><text x="115" y="208" font-size="11" fill="#557086">UART / RTSP / JSONL</text></g>
    <g><rect x="222" y="128" width="146" height="96" rx="12" fill="#edf6f3" stroke="#4b9a86" stroke-width="2"/><text x="295" y="166" font-size="15" font-weight="700" fill="#286e5e">Detection</text><text x="295" y="190" font-size="12" fill="#55786e">YOLO adapters</text><text x="295" y="208" font-size="11" fill="#55786e">normalize + provenance</text></g>
    <g><rect x="402" y="128" width="146" height="96" rx="12" fill="#eef0fb" stroke="#7a79bd" stroke-width="2"/><text x="475" y="166" font-size="15" font-weight="700" fill="#555399">Tracking</text><text x="475" y="190" font-size="12" fill="#66678c">multi-object identity</text><text x="475" y="208" font-size="11" fill="#66678c">Kalman + gating</text></g>
    <g><rect x="582" y="128" width="146" height="96" rx="12" fill="#f4edf9" stroke="#a16cc1" stroke-width="2"/><text x="655" y="166" font-size="15" font-weight="700" fill="#794e98">Motion state</text><text x="655" y="190" font-size="12" fill="#795f87">behavior + velocity</text><text x="655" y="208" font-size="11" fill="#795f87">image coordinates</text></g>
    <g><rect x="762" y="128" width="146" height="96" rx="12" fill="#fff3e1" stroke="#d39439" stroke-width="2"/><text x="835" y="166" font-size="15" font-weight="700" fill="#93621b">Prediction</text><text x="835" y="190" font-size="12" fill="#876a3b">CV · CA · CTRV-lite</text><text x="835" y="208" font-size="11" fill="#876a3b">IMM / adaptive lanes</text></g>
    <g><rect x="942" y="128" width="196" height="96" rx="12" fill="#e9eff3" stroke="#607d92" stroke-width="2"/><text x="1040" y="166" font-size="15" font-weight="700" fill="#3f5b70">Advice + Studio</text><text x="1040" y="190" font-size="12" fill="#597083">trajectory + diagnostics</text><text x="1040" y="208" font-size="11" fill="#597083">observation-only output</text></g>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="600" y="278" font-size="13" font-weight="700" fill="#405a70">STABLE_CV is the default profile</text>
    <text x="600" y="302" font-size="12" fill="#60798d">Advanced / Robust / Adaptive paths remain explicit research or shadow selections.</text>
    <text x="600" y="326" font-size="12" fill="#60798d">Actuators are disabled; hardware acceptance is still pending.</text>
  </g>
</svg>

