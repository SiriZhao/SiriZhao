<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">PestMotion motion-intelligence architecture</title>
  <desc id="desc">Vision input flows through detection, multi-object tracking, motion estimation, adaptive prediction and advisory visualization.</desc>
  <rect width="1200" height="360" rx="18" fill="#0b1420" stroke="#24384b"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="44" y="48" font-size="14" font-weight="700" letter-spacing="2.5" fill="#8fc7f2">PESTMOTION / MOTION INTELLIGENCE</text>
    <text x="44" y="76" font-size="16" fill="#a7bdd0">Research pipeline for agricultural-robotics vision inputs · advisory output</text>
  </g>
  <g fill="none" stroke="#527b9d" stroke-width="3" stroke-linecap="round">
    <path d="M188 176H223M368 176H403M548 176H583M728 176H763M908 176H943"/>
    <path d="M213 167l12 9-12 9M393 167l12 9-12 9M573 167l12 9-12 9M753 167l12 9-12 9M933 167l12 9-12 9"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g><rect x="42" y="128" width="146" height="96" rx="12" fill="#163552" stroke="#78b5e8" stroke-width="2"/><text x="115" y="166" font-size="15" font-weight="700" fill="#cce8ff">Vision input</text><text x="115" y="190" font-size="12" fill="#b1cada">local · USB · LAN</text><text x="115" y="208" font-size="11" fill="#9bb5c9">UART / RTSP / JSONL</text></g>
    <g><rect x="222" y="128" width="146" height="96" rx="12" fill="#153b38" stroke="#66c6b2" stroke-width="2"/><text x="295" y="166" font-size="15" font-weight="700" fill="#c7f5ea">Detection</text><text x="295" y="190" font-size="12" fill="#b1d8cf">YOLO adapters</text><text x="295" y="208" font-size="11" fill="#9ec7bd">normalize + provenance</text></g>
    <g><rect x="402" y="128" width="146" height="96" rx="12" fill="#27274a" stroke="#9a98e4" stroke-width="2"/><text x="475" y="166" font-size="15" font-weight="700" fill="#dedcff">Tracking</text><text x="475" y="190" font-size="12" fill="#c1c3dc">multi-object identity</text><text x="475" y="208" font-size="11" fill="#aeb0cb">Kalman + gating</text></g>
    <g><rect x="582" y="128" width="146" height="96" rx="12" fill="#352449" stroke="#c28ee1" stroke-width="2"/><text x="655" y="166" font-size="15" font-weight="700" fill="#f0d8ff">Motion state</text><text x="655" y="190" font-size="12" fill="#d6bce3">behavior + velocity</text><text x="655" y="208" font-size="11" fill="#c3a8d0">image coordinates</text></g>
    <g><rect x="762" y="128" width="146" height="96" rx="12" fill="#44331a" stroke="#e3b35d" stroke-width="2"/><text x="835" y="166" font-size="15" font-weight="700" fill="#ffe4ad">Prediction</text><text x="835" y="190" font-size="12" fill="#e3c98d">CV · CA · CTRV-lite</text><text x="835" y="208" font-size="11" fill="#d3b875">IMM / adaptive lanes</text></g>
    <g><rect x="942" y="128" width="196" height="96" rx="12" fill="#243444" stroke="#8ea6bb" stroke-width="2"/><text x="1040" y="166" font-size="15" font-weight="700" fill="#d7e4ef">Advice + Studio</text><text x="1040" y="190" font-size="12" fill="#b6c9d8">trajectory + diagnostics</text><text x="1040" y="208" font-size="11" fill="#a6bacb">observation-only output</text></g>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="600" y="278" font-size="13" font-weight="700" fill="#d4e3ef">STABLE_CV is the default profile</text>
    <text x="600" y="302" font-size="12" fill="#a7bdd0">Advanced / Robust / Adaptive paths remain explicit research or shadow selections.</text>
    <text x="600" y="326" font-size="12" fill="#a7bdd0">Actuators are disabled; hardware acceptance is still pending.</text>
  </g>
</svg>

