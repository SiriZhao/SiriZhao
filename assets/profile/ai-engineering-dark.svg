<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc">
  <title id="title">AI-assisted engineering workflow</title>
  <desc id="desc">Requirements become architecture, agent-assisted implementation, testing, review, deployment and iteration.</desc>
  <rect width="1200" height="210" rx="18" fill="#0b1420" stroke="#24384b"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="34" y="38" font-size="13" font-weight="700" letter-spacing="2.2" fill="#8fc7f2">AI-ASSISTED ENGINEERING</text></g>
  <g fill="none" stroke="#527b9d" stroke-width="3"><path d="M166 111H199M349 111H382M532 111H565M715 111H748M898 111H931"/><path d="M189 103l10 8-10 8M372 103l10 8-10 8M555 103l10 8-10 8M738 103l10 8-10 8M921 103l10 8-10 8"/></g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g><rect x="28" y="75" width="138" height="72" rx="10" fill="#163552" stroke="#78b5e8" stroke-width="2"/><text x="97" y="104" font-size="14" font-weight="700" fill="#cce8ff">Requirements</text><text x="97" y="126" font-size="11" fill="#b1cada">specification</text></g>
    <g><rect x="211" y="75" width="138" height="72" rx="10" fill="#153b38" stroke="#66c6b2" stroke-width="2"/><text x="280" y="104" font-size="14" font-weight="700" fill="#c7f5ea">Architecture</text><text x="280" y="126" font-size="11" fill="#b1d8cf">boundaries</text></g>
    <g><rect x="394" y="75" width="138" height="72" rx="10" fill="#27274a" stroke="#9a98e4" stroke-width="2"/><text x="463" y="104" font-size="14" font-weight="700" fill="#dedcff">Implementation</text><text x="463" y="126" font-size="11" fill="#c1c3dc">agent-assisted</text></g>
    <g><rect x="577" y="75" width="138" height="72" rx="10" fill="#352449" stroke="#c28ee1" stroke-width="2"/><text x="646" y="104" font-size="14" font-weight="700" fill="#f0d8ff">Test + review</text><text x="646" y="126" font-size="11" fill="#d6bce3">regression</text></g>
    <g><rect x="760" y="75" width="138" height="72" rx="10" fill="#44331a" stroke="#e3b35d" stroke-width="2"/><text x="829" y="104" font-size="14" font-weight="700" fill="#ffe4ad">Deployment</text><text x="829" y="126" font-size="11" fill="#e3c98d">release</text></g>
    <g><rect x="943" y="75" width="138" height="72" rx="10" fill="#243444" stroke="#8ea6bb" stroke-width="2"/><text x="1012" y="104" font-size="14" font-weight="700" fill="#d7e4ef">Iteration</text><text x="1012" y="126" font-size="11" fill="#b6c9d8">human decision</text></g>
  </g>
</svg>

