name: Update profile activity

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1,4"

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Render public repository snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/render_activity.py

      - name: Render contribution trail
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: SiriZhao
          outputs: |
            assets/generated/snake-light.svg?palette=github-light&color_snake=%235b7790
            assets/generated/snake-dark.svg?palette=github-dark&color_snake=%238caac5

      - name: Commit only changed assets
        run: |
          git add -- assets/generated/activity-light.svg assets/generated/activity-dark.svg assets/generated/snake-light.svg assets/generated/snake-dark.svg
          if git diff --cached --quiet; then
            echo "Activity assets are unchanged."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update profile activity assets'
          git push origin HEAD:${{ github.ref_name }}
